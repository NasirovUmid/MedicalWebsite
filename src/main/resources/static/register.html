<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Регистрация — DentaVita</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-panel"><a class="logo" href="index.html"><b>+</b>Denta<em>Vita</em></a><div class="auth-mark">✦</div><h1>Ваша улыбка —<br><i>наша забота.</i></h1><p>Создайте личный кабинет, чтобы записываться к врачу и всегда иметь информацию о лечении под рукой.</p></section><section class="auth-content"><a class="logo" href="index.html"><b>+</b>Denta<em>Vita</em></a><p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p><h2>Создать аккаунт</h2><p class="auth-subtitle">Уже зарегистрированы? <a href="login.html">Войти</a></p><form class="auth-form" id="register-form"><div class="message" id="form-message" aria-live="polite"></div><label class="field">Ваше имя<input name="fullName" placeholder="Например, Азиза Каримова" required></label><div class="form-row"><label class="field">Email<input name="email" type="email" placeholder="you@email.com" required></label><label class="field">Телефон<input name="phoneNumber" type="tel" placeholder="+998 90 123 45 67" pattern="\+?998\d{9}" required></label></div><label class="field">Дата рождения<input name="birthDate" type="date" required></label><div class="form-row"><label class="field">Пароль<input name="password" type="password" minlength="8" maxlength="30" placeholder="Минимум 8 символов" required></label><label class="field">Повторите пароль<input name="confirmPassword" type="password" minlength="8" maxlength="30" placeholder="Повторите пароль" required></label></div><button class="button" type="submit">Зарегистрироваться →</button></form></section></main><script src="auth.js"></script></body></html>
