<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Создать appointment — DentaVita</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-panel"><a class="logo" href="admin.html"><b>+</b>Denta<em>Vita</em></a><div class="auth-mark">✦</div><h1>Новый <i>appointment</i></h1><p>Запись пациента к врачу.</p></section><section class="auth-content"><p class="eyebrow">АДМИН-ПАНЕЛЬ</p><h2>Создать запись</h2><form class="auth-form" id="appointment-form"><div class="message" id="form-message"></div><label class="field">Пациент<select name="patientId" id="patient" required></select></label><label class="field">Врач<select name="doctorId" id="doctor" required></select></label><label class="field">Услуга<select name="serviceId" id="service" required></select></label><label class="field">Дата и время<input name="appointmentDate" id="appointment-date" type="datetime-local" required></label><fieldset class="schedule-fields"><legend>Medical schedule врача</legend><label class="check-field"><input type="checkbox" name="createSchedule" id="create-schedule"> Добавить рабочий интервал врачу</label><div class="form-row" id="schedule-inputs" hidden><label class="field">Начало<input name="scheduleStart" type="time"></label><label class="field">Окончание<input name="scheduleEnd" type="time"></label></div><small>Интервал создаётся для дня недели выбранной записи.</small></fieldset><button class="button" type="submit">Создать appointment →</button></form></section></main><script src="app.js"></script><script src="appointment.js"></script></body></html>
